<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аптека Вита Ботаника — наличие товара</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  max-width: 800px;
  margin: 0 auto;
  padding: 24px 16px 160px 16px;
  background: linear-gradient(180deg, #d8ecfc 0%, #eef7ff 50%, #f8fbff 100%);
  background-attachment: fixed;
  color: #1e293b;
  position: relative;
  min-height: 100vh;
}

/* Фоновый снегопад */
.snow-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.snowflake {
  position: fixed;
  top: -10%;
  color: #38bdf8;
  text-shadow: 0 0 5px rgba(2, 132, 199, 0.45);
  user-select: none;
  pointer-events: none;
  animation: snowfall linear infinite;
}
@keyframes snowfall {
  0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
  50% { transform: translateY(50vh) translateX(15px) rotate(180deg); }
  100% { transform: translateY(110vh) translateX(-15px) rotate(360deg); }
}

.content-wrap {
  position: relative;
  z-index: 2;
}

/* Зимняя шапка с сугробами сверху и ёлкой */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 12px;
  background: #ffffff;
  padding: 14px 20px;
  border-radius: 18px;
  border: 1px solid #bae6fd;
  box-shadow: 0 6px 20px rgba(14, 116, 144, 0.08);
  position: relative;
}

/* Голубоватые снежные шапки (сугробики) на крыше блока */
.header::before {
  content: "";
  position: absolute;
  top: -11px;
  left: 16px;
  right: 16px;
  height: 16px;
  background:
    radial-gradient(ellipse 48px 13px at 12% 100%, #bae6fd 92%, transparent 100%),
    radial-gradient(ellipse 75px 15px at 38% 100%, #7dd3fc 92%, transparent 100%),
    radial-gradient(ellipse 58px 12px at 68% 100%, #bae6fd 92%, transparent 100%),
    radial-gradient(ellipse 45px 14px at 88% 100%, #93c5fd 92%, transparent 100%);
  filter: drop-shadow(0 -2px 3px rgba(2, 132, 199, 0.18));
  pointer-events: none;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header img {
  height: 56px;
  width: auto;
  display: block;
  mix-blend-mode: multiply;
}

h1 {
  font-size: 21px;
  margin: 0;
  color: #0c4a6e;
  letter-spacing: -0.2px;
}

/* Ёлочка в шапке */
.tree-box {
  width: 52px;
  height: 60px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tree-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 3px 5px rgba(12, 74, 110, 0.14));
}

@keyframes twinkle {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.85); }
}
.light-1 { animation: twinkle 2.2s infinite ease-in-out; transform-origin: center; }
.light-2 { animation: twinkle 2.8s infinite ease-in-out 0.7s; transform-origin: center; }
.light-3 { animation: twinkle 2.4s infinite ease-in-out 1.3s; transform-origin: center; }

.upd {
  color: #475569;
  font-size: 13px;
  margin-bottom: 18px;
  padding-left: 4px;
}

/* Поле поиска с голубоватыми сугробиками */
.search-wrap {
  position: relative;
  margin-bottom: 4px;
}
.search-wrap::before {
  content: "";
  position: absolute;
  top: -9px;
  left: 20px;
  right: 20px;
  height: 12px;
  background:
    radial-gradient(ellipse 55px 11px at 20% 100%, #7dd3fc 92%, transparent 100%),
    radial-gradient(ellipse 45px 9px at 52% 100%, #bae6fd 92%, transparent 100%),
    radial-gradient(ellipse 70px 11px at 80% 100%, #93c5fd 92%, transparent 100%);
  filter: drop-shadow(0 -1px 2px rgba(2, 132, 199, 0.15));
  z-index: 2;
  pointer-events: none;
}

#search {
  width: 100%;
  padding: 14px 16px;
  font-size: 17px;
  background: rgba(255, 255, 255, 0.96);
  border: 2px solid #7dd3fc;
  border-radius: 12px;
  outline: none;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
  transition: all 0.2s ease;
}
#search:focus {
  border-color: #0284c7;
  background: #ffffff;
  box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
}

.count {
  color: #475569;
  font-size: 13px;
  margin: 12px 4px;
  font-weight: 500;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255, 255, 255, 0.94);
  padding: 12px 16px;
  margin-bottom: 8px;
  border-radius: 12px;
  border: 1px solid #bae6fd;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.item:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(2, 132, 199, 0.12);
  border-color: #7dd3fc;
}

.name {
  flex: 1;
  padding-right: 12px;
  line-height: 1.35;
}
.qty {
  white-space: nowrap;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 14px;
}
.in {
  background: #e0f2fe;
  color: #0369a1;
  border: 1px solid #bae6fd;
}
.out {
  background: #fdecec;
  color: #c0392b;
}
.empty {
  text-align: center;
  color: #64748b;
  padding: 36px;
  background: rgba(255, 255, 255, 0.75);
  border-radius: 12px;
  border: 1px dashed #93c5fd;
}

/* Зимний пейзаж по нижнему краю (заполняется очищенной от сетки картинкой) */
.snowdrifts-bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 140px;
  pointer-events: none;
  z-index: 3;
  background-position: bottom center;
  background-repeat: repeat-x;
  background-size: auto 100%;
}

@media (max-width: 600px) {
  body {
    padding-bottom: 120px;
  }
  .snowdrifts-bottom {
    height: 95px;
  }
}
</style>
</head>
<body>

<div class="snow-container" id="snow"></div>

<div class="content-wrap">
  <div class="header">
    <div class="header-left">
      <img src="logo.png" alt="logo" onerror="this.style.display='none'">
      <h1>Аптека «Вита Ботаника»</h1>
    </div>

    <!-- Нарядная зимняя ёлочка в шапке -->
    <div class="tree-box" title="С зимними праздниками!">
      <svg class="tree-svg" viewBox="0 0 64 76" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="32" cy="70" rx="23" ry="5.5" fill="#7dd3fc"/>
        <ellipse cx="32" cy="70" rx="17" ry="3.8" fill="#bae6fd"/>
        <rect x="28" y="58" width="8" height="11" rx="2" fill="#78350f"/>
        <path d="M8 60 L32 32 L56 60 Z" fill="#15803d"/>
        <path d="M12 60 Q22 55 32 60 Q42 55 52 60" stroke="#bae6fd" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M13 44 L32 19 L51 44 Z" fill="#16a34a"/>
        <path d="M16 44 Q24 40 32 44 Q40 40 48 44" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M18 28 L32 7 L46 28 Z" fill="#22c55e"/>
        <path d="M21 28 Q26 25 32 28 Q38 25 43 28" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <polygon class="light-1" points="32,0 34.2,5 39.5,5.5 35.5,9 36.8,14 32,11.2 27.2,14 28.5,9 24.5,5.5 29.8,5" fill="#fbbf24"/>
        <circle class="light-2" cx="26" cy="23" r="2.6" fill="#d4125c"/>
        <circle class="light-3" cx="37" cy="35" r="3" fill="#fbbf24"/>
        <circle class="light-1" cx="23" cy="39" r="2.8" fill="#38bdf8"/>
        <circle class="light-2" cx="41" cy="52" r="3.2" fill="#d4125c"/>
        <circle class="light-3" cx="21" cy="53" r="3" fill="#fbbf24"/>
        <circle class="light-1" cx="32" cy="49" r="2.5" fill="#ffffff"/>
      </svg>
    </div>
  </div>

  <div class="upd" id="upd">❄️ Загрузка данных…</div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="🔍 Поиск товара…" oninput="render(this.value)">
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>

<!-- Заснеженные ели и сугробы по нижнему краю страницы -->
<div class="snowdrifts-bottom" id="snowdrifts"></div>

<script>
// Автоматическое удаление серо-белой шахматной сетки с картинки snowdrifts.png
(function cleanAndRenderSnowdrifts() {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    const w = img.width;
    const h = img.height;
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;

    // 1. Отрезаем нижнюю полосу сетки, если она есть (находим нижний край голубых сугробов)
    let bottomContentY = h - 1;
    for (let y = h - 1; y >= Math.floor(h * 0.5); y--) {
      let bluePixelsInRow = 0;
      for (let x = 0; x < w; x += 4) {
        const idx = (y * w + x) * 4;
        const r = d[idx], g = d[idx + 1], b = d[idx + 2];
        // У сугробов всегда есть заметный голубой оттенок (b > r + 6)
        if (b - r > 6 || (r > 240 && g > 246 && b > 252)) {
          bluePixelsInRow++;
        }
      }
      if (bluePixelsInRow > (w / 4) * 0.35) {
        bottomContentY = y;
        break;
      }
    }

    // 2. Идём сверху вниз по каждому столбцу и удаляем нейтрально-серые/белые пиксели сетки до начала елей и сугробов
    for (let x = 0; x < w; x++) {
      let hitSnowOrTree = false;
      for (let y = 0; y <= bottomContentY; y++) {
        const idx = (y * w + x) * 4;
        const r = d[idx], g = d[idx + 1], b = d[idx + 2];
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const sat = max - min; // насыщенность цвета

        if (!hitSnowOrTree) {
          // Пиксели шахматной сетки абсолютно нейтральны (серые или белые: sat <= 10, b - r <= 6)
          // Как только встречаем хвою или голубоватый контур снега (b - r > 7 или sat > 12) — останавливаем удаление в этом столбце
          if (b - r > 8 || g - r > 8 || sat > 12) {
            hitSnowOrTree = true;
          } else {
            d[idx + 3] = 0; // делаем пиксель сетки полностью прозрачным
          }
        } else {
          // Даже чуть ниже верхушек елей убираем чисто серые квадратики сетки между ветками
          if (sat <= 5 && r >= 175 && r <= 242 && b - r <= 4) {
            d[idx + 3] = 0;
          }
        }
      }
    }

    // Обрезаем холст ровно по нижнему краю сугробов
    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = w;
    finalCanvas.height = bottomContentY + 1;
    finalCanvas.getContext('2d').putImageData(imgData, 0, 0);

    document.getElementById('snowdrifts').style.backgroundImage = 'url(' + finalCanvas.toDataURL('image/png') + ')';
  };
  img.src = 'snowdrifts.png?v=' + Date.now();
})();

// Генерация снегопада с синими и голубыми оттенками
(function createSnow() {
  const container = document.getElementById('snow');
  const symbols = ['❄', '❅', '❆', '•'];
  const colors = ['#0284c7', '#0ea5e9', '#38bdf8', '#2563eb'];
  const count = 32;
  for (let i = 0; i < count; i++) {
    const flake = document.createElement('div');
    flake.className = 'snowflake';
    flake.textContent = symbols[i % symbols.length];
    flake.style.color = colors[i % colors.length];
    flake.style.left = (Math.random() * 100) + 'vw';
    flake.style.fontSize = (Math.random() * 13 + 11) + 'px';
    flake.style.opacity = (Math.random() * 0.45 + 0.45).toFixed(2);
    flake.style.animationDuration = (Math.random() * 10 + 9) + 's';
    flake.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(flake);
  }
})();

let goods = [];

fetch('ostatki.txt?v=' + Date.now())
  .then(r => r.arrayBuffer())
  .then(buf => {
    const bytes = new Uint8Array(buf);
    const text = new TextDecoder('windows-1251').decode(bytes);

    goods = parse(text);

    let updateTime = 'Дата обновления: не указана';
    const lines = text.split(/\r?\n/);
    for (let l of lines) {
      if (l.indexOf('Дата обновления') !== -1) { updateTime = l.trim(); break; }
      if (l.indexOf('Остатки товаров') !== -1) { updateTime = l.trim(); break; }
    }

    document.getElementById('upd').textContent = '❄️ ' + updateTime;
    render('');
  })
  .catch(error => {
    console.error("Ошибка загрузки:", error);
    document.getElementById('upd').textContent = '⚠ Не удалось загрузить ostatki.txt';
  });

function parse(text) {
  const lines = text.split(/\r?\n/);
  const result = [];

  for (let raw of lines) {
    if (!raw.trim()) continue;

    const matches = raw.match(/-?\d+(?:\.\d+)?/g);
    if (!matches || matches.length === 0) continue;

    const num = parseFloat(matches[matches.length - 1]);
    if (isNaN(num)) continue;

    const lastNum = matches[matches.length - 1];
    const cutPos = raw.lastIndexOf(lastNum);
    let name = raw.substring(0, cutPos).trim();

    if (!name) continue;

    if (name.indexOf('Остатки товаров') !== -1) continue;
    if (name.indexOf('по всем складам') !== -1) continue;
    if (name.indexOf('Итого') !== -1) continue;
    if (name === 'Товар' || name.indexOf('Товар /') === 0) continue;
    if (name.indexOf('Дата обновления') !== -1) continue;

    result.push({ name: name, qty: num });
  }
  return result;
}

function fmt(n) {
  const r = Math.round(n * 10) / 10;
  return Number.isInteger(r) ? r.toString() : r.toString().replace('.', ',');
}

function render(query) {
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  query = (query || '').toLowerCase().trim();

  let filtered = goods.filter(g => Math.round(g.qty * 10) / 10 > 0);

  if (query) {
    filtered = filtered.filter(g => g.name.toLowerCase().indexOf(query) !== -1);
  }

  count.textContent = 'Найдено: ' + filtered.length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">❄️ Ничего не найдено</div>';
    return;
  }

  let html = '';
  for (let g of filtered) {
    html += '<div class="item">' +
              '<div class="name">' + escapeHtml(g.name) + '</div>' +
              '<div class="qty in">' + fmt(g.qty) + ' шт</div>' +
            '</div>';
  }
  list.innerHTML = html;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
}
</script>
</body>
</html>
