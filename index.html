<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аптека Вита Ботаника — наличие товара</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  max-width: 800px;
  margin: 0 auto;
  padding: 38px 16px 160px 16px;
  background: linear-gradient(180deg, #d8ecfc 0%, #eef7ff 50%, #f8fbff 100%);
  background-attachment: fixed;
  color: #1e293b;
  position: relative;
  min-height: 100vh;
}

/* Фоновый снегопад */
.snow-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.snowflake {
  position: fixed;
  top: -10%;
  color: #38bdf8;
  text-shadow: 0 0 5px rgba(2, 132, 199, 0.45);
  user-select: none;
  pointer-events: none;
  animation: snowfall linear infinite;
}
@keyframes snowfall {
  0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
  50% { transform: translateY(50vh) translateX(15px) rotate(180deg); }
  100% { transform: translateY(110vh) translateX(-15px) rotate(360deg); }
}

.content-wrap {
  position: relative;
  z-index: 2;
}

/* Зимняя шапка */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 12px;
  background: #ffffff;
  padding: 16px 20px 14px 20px;
  border-radius: 18px;
  border: 1px solid #bae6fd;
  box-shadow: 0 6px 20px rgba(14, 116, 144, 0.08);
  position: relative;
}

/* Приподняли сугроб над шапкой еще выше */
.header-snow-cap {
  position: absolute;
  top: -36px; /* Подняли выше */
  left: 6px;
  right: 6px;
  height: 42px;
  z-index: 4;
  background-size: 100% 100%;
  background-position: bottom center;
  background-repeat: no-repeat;
  filter: drop-shadow(0 2px 3px rgba(2, 132, 199, 0.16));
  pointer-events: none;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header img {
  height: 56px;
  width: auto;
  display: block;
  mix-blend-mode: multiply;
}

h1 {
  font-size: 21px;
  margin: 0;
  color: #0c4a6e;
  letter-spacing: -0.2px;
}

/* Нарядная ёлочка */
.tree-box {
  width: 52px;
  height: 60px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 0.3s ease;
}
.tree-box:hover {
  transform: scale(1.1) rotate(2deg);
}
.tree-image-container {
  width: 100%;
  height: 100%;
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  filter: drop-shadow(0 3px 5px rgba(12, 74, 110, 0.18));
}

.tree-box::after {
  content: "✨";
  position: absolute;
  top: -6px;
  right: 6px;
  font-size: 14px;
  animation: twinkle 1.8s infinite ease-in-out;
  pointer-events: none;
}
.tree-box::before {
  content: "⭐";
  position: absolute;
  top: -14px;
  left: calc(50% - 10px);
  font-size: 11px;
  color: #fbbf24;
  text-shadow: 0 0 6px rgba(251, 191, 36, 0.8);
  animation: starglow 2s infinite ease-in-out;
  pointer-events: none;
  opacity: 0.85;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.2) rotate(15deg); }
}
@keyframes starglow {
  0%, 100% { transform: scale(0.9); filter: brightness(1); }
  50% { transform: scale(1.15); filter: brightness(1.3); }
}

.upd {
  color: #475569;
  font-size: 13px;
  margin-bottom: 24px;
  padding-left: 4px;
}

/* Поле поиска */
.search-wrap {
  position: relative;
  margin-bottom: 4px;
}

/* Приподняли сугроб над поиском еще выше */
.search-snow-cap {
  position: absolute;
  top: -26px; /* Подняли выше */
  left: 10px;
  right: 10px;
  height: 32px;
  z-index: 5;
  background-size: 100% 100%;
  background-position: bottom center;
  background-repeat: no-repeat;
  filter: drop-shadow(0 2px 2px rgba(2, 132, 199, 0.14));
  pointer-events: none;
}

#search {
  width: 100%;
  padding: 14px 16px;
  font-size: 17px;
  background: rgba(255, 255, 255, 0.96);
  border: 2px solid #7dd3fc;
  border-radius: 12px;
  outline: none;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
  transition: all 0.2s ease;
}
#search:focus {
  border-color: #0284c7;
  background: #ffffff;
  box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
}

.count {
  color: #475569;
  font-size: 13px;
  margin: 12px 4px;
  font-weight: 500;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255, 255, 255, 0.94);
  padding: 12px 16px;
  margin-bottom: 8px;
  border-radius: 12px;
  border: 1px solid #bae6fd;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.item:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(2, 132, 199, 0.12);
  border-color: #7dd3fc;
}

.name {
  flex: 1;
  padding-right: 12px;
  line-height: 1.35;
}
.qty {
  white-space: nowrap;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 14px;
}
.in {
  background: #e0f2fe;
  color: #0369a1;
  border: 1px solid #bae6fd;
}
.out {
  background: #fdecec;
  color: #c0392b;
}
.empty {
  text-align: center;
  color: #64748b;
  padding: 36px;
  background: rgba(255, 255, 255, 0.75);
  border-radius: 12px;
  border: 1px dashed #93c5fd;
}

/* Нижние художественные сугробы */
.snowdrifts-bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 140px;
  pointer-events: none;
  z-index: 3;
  background-position: bottom center;
  background-repeat: repeat-x;
  background-size: auto 100%;
}

@media (max-width: 600px) {
  body {
    padding-top: 30px;
    padding-bottom: 120px;
  }
  .snowdrifts-bottom {
    height: 95px;
  }
  .header-snow-cap {
    top: -26px;
    height: 32px;
  }
  .search-snow-cap {
    top: -20px;
    height: 24px;
  }
}
</style>
</head>
<body>

<div class="snow-container" id="snow"></div>

<div class="content-wrap">
  <div class="header">
    <div class="header-snow-cap" id="headerSnowCap"></div>

    <div class="header-left">
      <img src="logo.png" alt="logo" onerror="this.style.display='none'">
      <h1>Аптека «Вита Ботаника»</h1>
    </div>

    <div class="tree-box" title="С зимними праздниками!">
      <div class="tree-image-container" id="christmasTree"></div>
    </div>
  </div>

  <div class="upd" id="upd">❄️ Загрузка данных…</div>

  <div class="search-wrap">
    <div class="search-snow-cap" id="searchSnowCap"></div>
    <input type="text" id="search" placeholder="🔍 Поиск товара…" oninput="render(this.value)">
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>

<div class="snowdrifts-bottom" id="snowdrifts"></div>

<script>
// Автоматическая очистка кэша для применения новых отступов сугробов
if (localStorage.getItem('vb_fix_v4') !== 'true') {
  localStorage.removeItem('vb_cap1_v3');
  localStorage.removeItem('vb_cap2_v3');
  localStorage.setItem('vb_fix_v4', 'true');
}

// Загрузка ёлочки
(function processChristmasTree() {
  try {
    const cachedTree = localStorage.getItem('vb_christmastree_v1');
    if (cachedTree) {
      document.getElementById('christmasTree').style.backgroundImage = 'url(' + cachedTree + ')';
      return;
    }
  } catch (e) {}

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    const w = 150;
    const h = Math.round((img.height / img.width) * w);
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;

    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2];
      const maxDiff = Math.max(Math.abs(r-g), Math.abs(g-b), Math.abs(b-r));
      if (r > 232 && g > 232 && b > 232 && maxDiff < 14) {
        d[i+3] = 0;
      }
    }

    ctx.putImageData(imgData, 0, 0);
    const dataUrl = canvas.toDataURL('image/png');
    document.getElementById('christmasTree').style.backgroundImage = 'url(' + dataUrl + ')';

    try {
      localStorage.setItem('vb_christmastree_v1', dataUrl);
    } catch (e) {}
  };
  img.src = 'christmastree.png';
})();

// Вырезка верхних сугробов
(function processTopSnowImage() {
  try {
    const cached1 = localStorage.getItem('vb_cap1_v4');
    const cached2 = localStorage.getItem('vb_cap2_v4');
    if (cached1 && cached2) {
      document.getElementById('headerSnowCap').style.backgroundImage = 'url(' + cached1 + ')';
      document.getElementById('searchSnowCap').style.backgroundImage = 'url(' + cached2 + ')';
      return;
    }
  } catch (e) {}

  const filesToTry = ['top-snow.png', 'top-snow.jpg', 'top-snow.png.jpg'];
  let attempt = 0;

  function loadNext() {
    if (attempt >= filesToTry.length) return;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      const scale = Math.min(1, 900 / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);

      function extractSnowCap(yStartPct, yEndPct) {
        const y0 = Math.floor(h * yStartPct);
        const y1 = Math.floor(h * yEndPct);
        const sliceH = y1 - y0;

        const c = document.createElement('canvas');
        c.width = w;
        c.height = sliceH;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, Math.floor(img.height * yStartPct), img.width, Math.floor(img.height * (yEndPct - yStartPct)), 0, 0, w, sliceH);

        const imgData = ctx.getImageData(0, 0, w, sliceH);
        const d = imgData.data;

        const isSnow = function(idx) {
          const r = d[idx], g = d[idx + 1], b = d[idx + 2];
          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          if ((max - min < 12) && r < 215) return false;
          return (b - r >= 5) || (r > 180 && g > 185 && b > 190);
        };

        for (let x = 0; x < w; x++) {
          let topEdge = 0;
          while (topEdge < sliceH && !isSnow((topEdge * w + x) * 4)) {
            d[(topEdge * w + x) * 4 + 3] = 0;
            topEdge++;
          }
          let botEdge = sliceH - 1;
          while (botEdge >= topEdge && !isSnow((botEdge * w + x) * 4)) {
            d[(botEdge * w + x) * 4 + 3] = 0;
            botEdge--;
          }
        }

        ctx.putImageData(imgData, 0, 0);

        let minX = w, maxX = 0, minY = sliceH, maxY = 0;
        for (let y = 0; y < sliceH; y++) {
          for (let x = 0; x < w; x++) {
            if (d[(y * w + x) * 4 + 3] > 0) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        if (maxX <= minX || maxY <= minY) return null;

        const cropW = maxX - minX + 1;
        const cropH = maxY - minY + 1;
        const out = document.createElement('canvas');
        out.width = cropW;
        out.height = cropH;
        out.getContext('2d').drawImage(c, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
        return out.toDataURL('image/png');
      }

      const cap1 = extractSnowCap(0.08, 0.45);
      const cap2 = extractSnowCap(0.55, 0.76);

      if (cap1) document.getElementById('headerSnowCap').style.backgroundImage = 'url(' + cap1 + ')';
      if (cap2) document.getElementById('searchSnowCap').style.backgroundImage = 'url(' + cap2 + ')';

      try {
        if (cap1) localStorage.setItem('vb_cap1_v4', cap1);
        if (cap2) localStorage.setItem('vb_cap2_v4', cap2);
      } catch (e) {}
    };
    img.onerror = function() {
      attempt++;
      loadNext();
    };
    img.src = filesToTry[attempt];
  }

  loadNext();
})();

// Нижние сугробы
(function cleanAndRenderSnowdrifts() {
  try {
    const cachedBottom = localStorage.getItem('vb_bottom_snow_v1');
    if (cachedBottom) {
      document.getElementById('snowdrifts').style.backgroundImage = 'url(' + cachedBottom + ')';
      return;
    }
  } catch (e) {}

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    const scale = Math.min(1, 1000 / img.width);
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;

    let bottomContentY = h - 1;
    for (let y = h - 1; y >= Math.floor(h * 0.5); y--) {
      let bluePixelsInRow = 0;
      for (let x = 0; x < w; x += 4) {
        const idx = (y * w + x) * 4;
        const r = d[idx], g = d[idx + 1], b = d[idx + 2];
        if (b - r > 6 || (r > 240 && g > 246 && b > 252)) {
          bluePixelsInRow++;
        }
      }
      if (bluePixelsInRow > (w / 4) * 0.35) {
        bottomContentY = y;
        break;
      }
    }

    for (let x = 0; x < w; x++) {
      let hitSnowOrTree = false;
      for (let y = 0; y <= bottomContentY; y++) {
        const idx = (y * w + x) * 4;
        const r = d[idx], g = d[idx + 1], b = d[idx + 2];
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const sat = max - min;

        if (!hitSnowOrTree) {
          if (b - r > 8 || g - r > 8 || sat > 12) {
            hitSnowOrTree = true;
          } else {
            d[idx + 3] = 0;
          }
        } else {
          if (sat <= 5 && r >= 175 && r <= 242 && b - r <= 4) {
            d[idx + 3] = 0;
          }
        }
      }
    }

    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = w;
    finalCanvas.height = bottomContentY + 1;
    finalCanvas.getContext('2d').putImageData(imgData, 0, 0);

    const dataUrl = finalCanvas.toDataURL('image/png');
    document.getElementById('snowdrifts').style.backgroundImage = 'url(' + dataUrl + ')';

    try {
      localStorage.setItem('vb_bottom_snow_v1', dataUrl);
    } catch (e) {}
  };
  img.src = 'snowdrifts.png';
})();

// Снегопад
(function createSnow() {
  const container = document.getElementById('snow');
  const symbols = ['❄', '❅', '❆', '•'];
  const colors = ['#0284c7', '#0ea5e9', '#38bdf8', '#2563eb'];
  const count = 32;
  for (let i = 0; i < count; i++) {
    const flake = document.createElement('div');
    flake.className = 'snowflake';
    flake.textContent = symbols[i % symbols.length];
    flake.style.color = colors[i % colors.length];
    flake.style.left = (Math.random() * 100) + 'vw';
    flake.style.fontSize = (Math.random() * 13 + 11) + 'px';
    flake.style.opacity = (Math.random() * 0.45 + 0.45).toFixed(2);
    flake.style.animationDuration = (Math.random() * 10 + 9) + 's';
    flake.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(flake);
  }
})();

let goods = [];

fetch('ostatki.txt?v=' + Date.now())
  .then(r => r.arrayBuffer())
  .then(buf => {
    const bytes = new Uint8Array(buf);
    const text = new TextDecoder('windows-1251').decode(bytes);

    goods = parse(text);

    let updateTime = 'Дата обновления: не указана';
    const lines = text.split(/\r?\n/);
    for (let l of lines) {
      if (l.indexOf('Дата обновления') !== -1) { updateTime = l.trim(); break; }
      if (l.indexOf('Остатки товаров') !== -1) { updateTime = l.trim(); break; }
    }

    document.getElementById('upd').textContent = '❄️ ' + updateTime;
    render('');
  })
  .catch(error => {
    console.error("Ошибка загрузки:", error);
    document.getElementById('upd').textContent = '⚠ Не удалось загрузить ostatki.txt';
  });

function parse(text) {
  const lines = text.split(/\r?\n/);
  const result = [];

  for (let raw of lines) {
    if (!raw.trim()) continue;

    const matches = raw.match(/-?\d+(?:\.\d+)?/g);
    if (!matches || matches.length === 0) continue;

    const num = parseFloat(matches[matches.length - 1]);
    if (isNaN(num)) continue;

    const lastNum = matches[matches.length - 1];
    const cutPos = raw.lastIndexOf(lastNum);
    let name = raw.substring(0, cutPos).trim();

    if (!name) continue;

    if (name.indexOf('Остатки товаров') !== -1) continue;
    if (name.indexOf('по всем складам') !== -1) continue;
    if (name.indexOf('Итого') !== -1) continue;
    if (name === 'Товар' || name.indexOf('Товар /') === 0) continue;
    if (name.indexOf('Дата обновления') !== -1) continue;

    result.push({ name: name, qty: num });
  }
  return result;
}

function fmt(n) {
  const r = Math.round(n * 10) / 10;
  return Number.isInteger(r) ? r.toString() : r.toString().replace('.', ',');
}

function render(query) {
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  query = (query || '').toLowerCase().trim();

  let filtered = goods.filter(g => Math.round(g.qty * 10) / 10 > 0);

  if (query) {
    filtered = filtered.filter(g => g.name.toLowerCase().indexOf(query) !== -1);
  }

  count.textContent = 'Найдено: ' + filtered.length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">❄️ Ничего не найдено</div>';
    return;
  }

  let html = '';
  for (let g of filtered) {
    html += '<div class="item">' +
              '<div class="name">' + escapeHtml(g.name) + '</div>' +
              '<div class="qty in">' + fmt(g.qty) + ' шт</div>' +
            '</div>';
  }
  list.innerHTML = html;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
}
</script>
</body>
</html>
