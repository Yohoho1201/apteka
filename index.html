<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аптека Вита Ботаника — наличие товара</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  max-width: 800px;
  margin: 0 auto;
  padding: 24px 16px 135px 16px;
  background: linear-gradient(180deg, #d8ecfc 0%, #eef7ff 50%, #f8fbff 100%);
  background-attachment: fixed;
  color: #1e293b;
  position: relative;
  min-height: 100vh;
}

/* Фоновый снегопад */
.snow-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.snowflake {
  position: fixed;
  top: -10%;
  color: #38bdf8;
  text-shadow: 0 0 5px rgba(2, 132, 199, 0.45);
  user-select: none;
  pointer-events: none;
  animation: snowfall linear infinite;
}
@keyframes snowfall {
  0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
  50% { transform: translateY(50vh) translateX(15px) rotate(180deg); }
  100% { transform: translateY(110vh) translateX(-15px) rotate(360deg); }
}

.content-wrap {
  position: relative;
  z-index: 2;
}

/* Зимняя шапка с голубоватыми сугробами сверху и ёлкой */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 12px;
  background: #ffffff;
  padding: 14px 20px;
  border-radius: 18px;
  border: 1px solid #bae6fd;
  box-shadow: 0 6px 20px rgba(14, 116, 144, 0.08);
  position: relative;
}

/* Голубоватые снежные шапки (сугробики) на крыше блока */
.header::before {
  content: "";
  position: absolute;
  top: -11px;
  left: 16px;
  right: 16px;
  height: 16px;
  background:
    radial-gradient(ellipse 48px 13px at 12% 100%, #bae6fd 92%, transparent 100%),
    radial-gradient(ellipse 75px 15px at 38% 100%, #7dd3fc 92%, transparent 100%),
    radial-gradient(ellipse 58px 12px at 68% 100%, #bae6fd 92%, transparent 100%),
    radial-gradient(ellipse 45px 14px at 88% 100%, #93c5fd 92%, transparent 100%);
  filter: drop-shadow(0 -2px 3px rgba(2, 132, 199, 0.18));
  pointer-events: none;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header img {
  height: 56px;
  width: auto;
  display: block;
  mix-blend-mode: multiply;
}

h1 {
  font-size: 21px;
  margin: 0;
  color: #0c4a6e;
  letter-spacing: -0.2px;
}

/* Ёлочка в шапке */
.tree-box {
  width: 52px;
  height: 60px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tree-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 3px 5px rgba(12, 74, 110, 0.14));
}

@keyframes twinkle {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.85); }
}
.light-1 { animation: twinkle 2.2s infinite ease-in-out; transform-origin: center; }
.light-2 { animation: twinkle 2.8s infinite ease-in-out 0.7s; transform-origin: center; }
.light-3 { animation: twinkle 2.4s infinite ease-in-out 1.3s; transform-origin: center; }

.upd {
  color: #475569;
  font-size: 13px;
  margin-bottom: 18px;
  padding-left: 4px;
}

/* Поле поиска с голубоватыми сугробиками */
.search-wrap {
  position: relative;
  margin-bottom: 4px;
}
.search-wrap::before {
  content: "";
  position: absolute;
  top: -9px;
  left: 20px;
  right: 20px;
  height: 12px;
  background:
    radial-gradient(ellipse 55px 11px at 20% 100%, #7dd3fc 92%, transparent 100%),
    radial-gradient(ellipse 45px 9px at 52% 100%, #bae6fd 92%, transparent 100%),
    radial-gradient(ellipse 70px 11px at 80% 100%, #93c5fd 92%, transparent 100%);
  filter: drop-shadow(0 -1px 2px rgba(2, 132, 199, 0.15));
  z-index: 2;
  pointer-events: none;
}

#search {
  width: 100%;
  padding: 14px 16px;
  font-size: 17px;
  background: rgba(255, 255, 255, 0.96);
  border: 2px solid #7dd3fc;
  border-radius: 12px;
  outline: none;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
  transition: all 0.2s ease;
}
#search:focus {
  border-color: #0284c7;
  background: #ffffff;
  box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
}

.count {
  color: #475569;
  font-size: 13px;
  margin: 12px 4px;
  font-weight: 500;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255, 255, 255, 0.94);
  padding: 12px 16px;
  margin-bottom: 8px;
  border-radius: 12px;
  border: 1px solid #bae6fd;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.item:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(2, 132, 199, 0.12);
  border-color: #7dd3fc;
}

.name {
  flex: 1;
  padding-right: 12px;
  line-height: 1.35;
}
.qty {
  white-space: nowrap;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 14px;
}
.in {
  background: #e0f2fe;
  color: #0369a1;
  border: 1px solid #bae6fd;
}
.out {
  background: #fdecec;
  color: #c0392b;
}
.empty {
  text-align: center;
  color: #64748b;
  padding: 36px;
  background: rgba(255, 255, 255, 0.75);
  border-radius: 12px;
  border: 1px dashed #93c5fd;
}

/* Нижняя художественная панорама с объёмными сугробами и елями (без фона/сетки) */
.winter-scene-bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 115px;
  pointer-events: none;
  z-index: 3;
  display: flex;
  align-items: flex-end;
}
.hills-svg {
  width: 100%;
  height: 90px;
  display: block;
}
.corner-trees {
  position: fixed;
  bottom: 8px;
  height: 105px;
  width: auto;
  pointer-events: none;
  z-index: 4;
}
.corner-trees.left { left: 10px; }
.corner-trees.right { right: 10px; transform: scaleX(-1); }

@media (max-width: 600px) {
  .corner-trees { height: 78px; bottom: 6px; }
  .hills-svg { height: 68px; }
}
</style>
</head>
<body>

<div class="snow-container" id="snow"></div>

<div class="content-wrap">
  <div class="header">
    <div class="header-left">
      <img src="logo.png" alt="logo" onerror="this.style.display='none'">
      <h1>Аптека «Вита Ботаника»</h1>
    </div>

    <!-- Нарядная зимняя ёлочка в шапке -->
    <div class="tree-box" title="С зимними праздниками!">
      <svg class="tree-svg" viewBox="0 0 64 76" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="32" cy="70" rx="23" ry="5.5" fill="#7dd3fc"/>
        <ellipse cx="32" cy="70" rx="17" ry="3.8" fill="#bae6fd"/>
        <rect x="28" y="58" width="8" height="11" rx="2" fill="#78350f"/>
        <path d="M8 60 L32 32 L56 60 Z" fill="#15803d"/>
        <path d="M12 60 Q22 55 32 60 Q42 55 52 60" stroke="#bae6fd" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M13 44 L32 19 L51 44 Z" fill="#16a34a"/>
        <path d="M16 44 Q24 40 32 44 Q40 40 48 44" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M18 28 L32 7 L46 28 Z" fill="#22c55e"/>
        <path d="M21 28 Q26 25 32 28 Q38 25 43 28" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <polygon class="light-1" points="32,0 34.2,5 39.5,5.5 35.5,9 36.8,14 32,11.2 27.2,14 28.5,9 24.5,5.5 29.8,5" fill="#fbbf24"/>
        <circle class="light-2" cx="26" cy="23" r="2.6" fill="#d4125c"/>
        <circle class="light-3" cx="37" cy="35" r="3" fill="#fbbf24"/>
        <circle class="light-1" cx="23" cy="39" r="2.8" fill="#38bdf8"/>
        <circle class="light-2" cx="41" cy="52" r="3.2" fill="#d4125c"/>
        <circle class="light-3" cx="21" cy="53" r="3" fill="#fbbf24"/>
        <circle class="light-1" cx="32" cy="49" r="2.5" fill="#ffffff"/>
      </svg>
    </div>
  </div>

  <div class="upd" id="upd">❄️ Загрузка данных…</div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="🔍 Поиск товара…" oninput="render(this.value)">
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>

<!-- Левая группа пышных заснеженных елей (фиксирована в углу, не обрезается на ПК и телефонах) -->
<svg class="corner-trees left" viewBox="0 0 180 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e6b52"/>
      <stop offset="100%" stop-color="#0f4c3a"/>
    </linearGradient>
    <linearGradient id="snowCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <!-- Дальняя маленькая ель -->
  <g transform="translate(95, 38) scale(0.65)" opacity="0.9">
    <path d="M45 10 L10 55 L80 55 Z" fill="url(#pineGrad)"/>
    <path d="M45 35 L5 85 L85 85 Z" fill="url(#pineGrad)"/>
    <path d="M45 60 L0 115 L90 115 Z" fill="url(#pineGrad)"/>
    <path d="M45 8 L22 38 Q45 45 68 38 Z" fill="url(#snowCap)"/>
    <path d="M12 55 Q45 64 78 55 Q65 47 45 50 Q25 47 12 55 Z" fill="url(#snowCap)"/>
    <path d="M7 85 Q45 95 83 85 Q68 76 45 80 Q22 76 7 85 Z" fill="url(#snowCap)"/>
  </g>
  <!-- Главная пушистая ель в снегу -->
  <g transform="translate(8, 5)">
    <rect x="44" y="102" width="12" height="18" rx="2" fill="#5c2d16"/>
    <!-- Хвоя -->
    <path d="M50 5 L15 50 L85 50 Z" fill="url(#pineGrad)"/>
    <path d="M50 30 L8 80 L92 80 Z" fill="url(#pineGrad)"/>
    <path d="M50 55 L0 110 L100 110 Z" fill="url(#pineGrad)"/>
    <!-- Пушистые снежные шапки на лапах -->
    <path d="M50 3 L26 34 Q38 41 50 36 Q62 41 74 34 Z" fill="url(#snowCap)"/>
    <path d="M15 50 Q32 58 50 52 Q68 58 85 50 Q74 42 50 45 Q26 42 15 50 Z" fill="url(#snowCap)"/>
    <path d="M8 80 Q28 90 50 82 Q72 90 92 80 Q78 70 50 74 Q22 70 8 80 Z" fill="url(#snowCap)"/>
    <path d="M0 110 Q25 120 50 112 Q75 120 100 110 Q85 98 50 103 Q15 98 0 110 Z" fill="url(#snowCap)"/>
  </g>
</svg>

<!-- Правая группа пышных заснеженных елей -->
<svg class="corner-trees right" viewBox="0 0 180 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(95, 42) scale(0.62)" opacity="0.9">
    <path d="M45 10 L10 55 L80 55 Z" fill="url(#pineGrad)"/>
    <path d="M45 35 L5 85 L85 85 Z" fill="url(#pineGrad)"/>
    <path d="M45 60 L0 115 L90 115 Z" fill="url(#pineGrad)"/>
    <path d="M45 8 L22 38 Q45 45 68 38 Z" fill="url(#snowCap)"/>
    <path d="M12 55 Q45 64 78 55 Q65 47 45 50 Q25 47 12 55 Z" fill="url(#snowCap)"/>
    <path d="M7 85 Q45 95 83 85 Q68 76 45 80 Q22 76 7 85 Z" fill="url(#snowCap)"/>
  </g>
  <g transform="translate(8, 8)">
    <rect x="44" y="102" width="12" height="18" rx="2" fill="#5c2d16"/>
    <path d="M50 5 L15 50 L85 50 Z" fill="url(#pineGrad)"/>
    <path d="M50 30 L8 80 L92 80 Z" fill="url(#pineGrad)"/>
    <path d="M50 55 L0 110 L100 110 Z" fill="url(#pineGrad)"/>
    <path d="M50 3 L26 34 Q38 41 50 36 Q62 41 74 34 Z" fill="url(#snowCap)"/>
    <path d="M15 50 Q32 58 50 52 Q68 58 85 50 Q74 42 50 45 Q26 42 15 50 Z" fill="url(#snowCap)"/>
    <path d="M8 80 Q28 90 50 82 Q72 90 92 80 Q78 70 50 74 Q22 70 8 80 Z" fill="url(#snowCap)"/>
    <path d="M0 110 Q25 120 50 112 Q75 120 100 110 Q85 98 50 103 Q15 98 0 110 Z" fill="url(#snowCap)"/>
  </g>
</svg>

<!-- Объёмные 3D-сугробы с мягкими голубыми градиентами по всей ширине экрана -->
<div class="winter-scene-bottom">
  <svg class="hills-svg" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="driftBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#93c5fd"/>
        <stop offset="100%" stop-color="#60a5fa"/>
      </linearGradient>
      <linearGradient id="driftMid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e0f2fe"/>
        <stop offset="100%" stop-color="#7dd3fc"/>
      </linearGradient>
      <linearGradient id="driftFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="55%" stop-color="#bae6fd"/>
        <stop offset="100%" stop-color="#7dd3fc"/>
      </linearGradient>
    </defs>
    <!-- Дальний сугроб -->
    <path d="M0,45 C320,5 580,90 920,38 C1180,5 1320,65 1440,30 L1440,120 L0,120 Z" fill="url(#driftBack)" opacity="0.85"/>
    <!-- Средний сугроб -->
    <path d="M0,62 C240,18 540,95 860,48 C1120,12 1290,78 1440,48 L1440,120 L0,120 Z" fill="url(#driftMid)"/>
    <!-- Передний объёмный сугроб с белоснежной верхушкой и голубой тенью -->
    <path d="M0,78 C350,35 650,108 1020,60 C1230,35 1360,82 1440,68 L1440,120 L0,120 Z" fill="url(#driftFront)" stroke="#ffffff" stroke-width="2"/>
  </svg>
</div>

<script>
// Генерация снегопада с синими и голубыми оттенками
(function createSnow() {
  const container = document.getElementById('snow');
  const symbols = ['❄', '❅', '❆', '•'];
  const colors = ['#0284c7', '#0ea5e9', '#38bdf8', '#2563eb'];
  const count = 32;
  for (let i = 0; i < count; i++) {
    const flake = document.createElement('div');
    flake.className = 'snowflake';
    flake.textContent = symbols[i % symbols.length];
    flake.style.color = colors[i % colors.length];
    flake.style.left = (Math.random() * 100) + 'vw';
    flake.style.fontSize = (Math.random() * 13 + 11) + 'px';
    flake.style.opacity = (Math.random() * 0.45 + 0.45).toFixed(2);
    flake.style.animationDuration = (Math.random() * 10 + 9) + 's';
    flake.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(flake);
  }
})();

let goods = [];

fetch('ostatki.txt?v=' + Date.now())
  .then(r => r.arrayBuffer())
  .then(buf => {
    const bytes = new Uint8Array(buf);
    const text = new TextDecoder('windows-1251').decode(bytes);

    goods = parse(text);

    let updateTime = 'Дата обновления: не указана';
    const lines = text.split(/\r?\n/);
    for (let l of lines) {
      if (l.indexOf('Дата обновления') !== -1) { updateTime = l.trim(); break; }
      if (l.indexOf('Остатки товаров') !== -1) { updateTime = l.trim(); break; }
    }

    document.getElementById('upd').textContent = '❄️ ' + updateTime;
    render('');
  })
  .catch(error => {
    console.error("Ошибка загрузки:", error);
    document.getElementById('upd').textContent = '⚠ Не удалось загрузить ostatki.txt';
  });

function parse(text) {
  const lines = text.split(/\r?\n/);
  const result = [];

  for (let raw of lines) {
    if (!raw.trim()) continue;

    const matches = raw.match(/-?\d+(?:\.\d+)?/g);
    if (!matches || matches.length === 0) continue;

    const num = parseFloat(matches[matches.length - 1]);
    if (isNaN(num)) continue;

    const lastNum = matches[matches.length - 1];
    const cutPos = raw.lastIndexOf(lastNum);
    let name = raw.substring(0, cutPos).trim();

    if (!name) continue;

    if (name.indexOf('Остатки товаров') !== -1) continue;
    if (name.indexOf('по всем складам') !== -1) continue;
    if (name.indexOf('Итого') !== -1) continue;
    if (name === 'Товар' || name.indexOf('Товар /') === 0) continue;
    if (name.indexOf('Дата обновления') !== -1) continue;

    result.push({ name: name, qty: num });
  }
  return result;
}

function fmt(n) {
  const r = Math.round(n * 10) / 10;
  return Number.isInteger(r) ? r.toString() : r.toString().replace('.', ',');
}

function render(query) {
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  query = (query || '').toLowerCase().trim();

  let filtered = goods.filter(g => Math.round(g.qty * 10) / 10 > 0);

  if (query) {
    filtered = filtered.filter(g => g.name.toLowerCase().indexOf(query) !== -1);
  }

  count.textContent = 'Найдено: ' + filtered.length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">❄️ Ничего не найдено</div>';
    return;
  }

  let html = '';
  for (let g of filtered) {
    html += '<div class="item">' +
              '<div class="name">' + escapeHtml(g.name) + '</div>' +
              '<div class="qty in">' + fmt(g.qty) + ' шт</div>' +
            '</div>';
  }
  list.innerHTML = html;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
}
</script>
</body>
</html>
