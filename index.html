<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аптека Вита Ботаника — наличие товара</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  max-width: 800px;
  margin: 0 auto;
  padding: 16px;
  background: linear-gradient(180deg, #dceefb 0%, #eff6fc 45%, #f8fbff 100%);
  background-attachment: fixed;
  color: #1e293b;
  position: relative;
  min-height: 100vh;
}

/* Фоновый снегопад */
.snow-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.snowflake {
  position: fixed;
  top: -10%;
  color: #ffffff;
  text-shadow: 0 0 6px rgba(14, 116, 144, 0.35);
  user-select: none;
  pointer-events: none;
  animation: snowfall linear infinite;
}
@keyframes snowfall {
  0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
  50% { transform: translateY(50vh) translateX(15px) rotate(180deg); }
  100% { transform: translateY(110vh) translateX(-15px) rotate(360deg); }
}

.content-wrap {
  position: relative;
  z-index: 1;
}

/* Зимняя шапка */
.header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 10px;
  background: #ffffff;
  padding: 12px 18px;
  border-radius: 16px;
  border: 1px solid #e0f2fe;
  box-shadow: 0 4px 18px rgba(14, 116, 144, 0.08);
  position: relative;
  overflow: hidden;
}
.header::after {
  content: "❄️";
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 26px;
  opacity: 0.25;
  pointer-events: none;
}
.header img {
  height: 56px;
  width: auto;
  display: block;
  mix-blend-mode: multiply; /* делает белый фон вокруг логотипа прозрачным */
}
h1 {
  font-size: 21px;
  margin: 0;
  color: #0c4a6e;
  letter-spacing: -0.2px;
}

.upd {
  color: #475569;
  font-size: 13px;
  margin-bottom: 14px;
  padding-left: 4px;
}

#search {
  width: 100%;
  padding: 14px 16px;
  font-size: 17px;
  background: rgba(255, 255, 255, 0.92);
  border: 2px solid #bae6fd;
  border-radius: 12px;
  outline: none;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.06);
  transition: all 0.2s ease;
}
#search:focus {
  border-color: #0284c7;
  background: #ffffff;
  box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
}

.count {
  color: #475569;
  font-size: 13px;
  margin: 12px 4px;
  font-weight: 500;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255, 255, 255, 0.94);
  padding: 12px 16px;
  margin-bottom: 8px;
  border-radius: 12px;
  border: 1px solid #e0f2fe;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.item:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(2, 132, 199, 0.1);
  border-color: #bae6fd;
}

.name {
  flex: 1;
  padding-right: 12px;
  line-height: 1.35;
}
.qty {
  white-space: nowrap;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 14px;
}
.in {
  background: #e0f2fe;
  color: #0369a1;
  border: 1px solid #bae6fd;
}
.out {
  background: #fdecec;
  color: #c0392b;
}
.empty {
  text-align: center;
  color: #64748b;
  padding: 36px;
  background: rgba(255, 255, 255, 0.7);
  border-radius: 12px;
  border: 1px dashed #cbd5e1;
}
</style>
</head>
<body>

<div class="snow-container" id="snow"></div>

<div class="content-wrap">
  <div class="header">
    <img src="logo.png" alt="logo" onerror="this.style.display='none'">
    <h1>Аптека «Вита Ботаника»</h1>
  </div>
  <div class="upd" id="upd">❄️ Загрузка данных…</div>

  <input type="text" id="search" placeholder="🔍 Поиск товара…" oninput="render(this.value)">
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>

<script>
// Генерация легкого снегопада
(function createSnow() {
  const container = document.getElementById('snow');
  const symbols = ['❄', '❅', '❆', '•'];
  const count = 28;
  for (let i = 0; i < count; i++) {
    const flake = document.createElement('div');
    flake.className = 'snowflake';
    flake.textContent = symbols[i % symbols.length];
    flake.style.left = (Math.random() * 100) + 'vw';
    flake.style.fontSize = (Math.random() * 12 + 10) + 'px';
    flake.style.opacity = (Math.random() * 0.55 + 0.25).toFixed(2);
    flake.style.animationDuration = (Math.random() * 10 + 9) + 's';
    flake.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(flake);
  }
})();

let goods = [];

fetch('ostatki.txt?v=' + Date.now())
  .then(r => r.arrayBuffer())
  .then(buf => {
    const bytes = new Uint8Array(buf);
    // 1С v7.7 пишет в Windows-1251 — декодируем сразу
    const text = new TextDecoder('windows-1251').decode(bytes);

    goods = parse(text);

    // Ищем строку с датой обновления (если есть)
    let updateTime = 'Дата обновления: не указана';
    const lines = text.split(/\r?\n/);
    for (let l of lines) {
      if (l.indexOf('Дата обновления') !== -1) { updateTime = l.trim(); break; }
      if (l.indexOf('Остатки товаров') !== -1) { updateTime = l.trim(); break; }
    }

    document.getElementById('upd').textContent = '❄️ ' + updateTime;
    render('');
  })
  .catch(error => {
    console.error("Ошибка загрузки:", error);
    document.getElementById('upd').textContent = '⚠ Не удалось загрузить ostatki.txt';
  });

function parse(text) {
  const lines = text.split(/\r?\n/);
  const result = [];

  for (let raw of lines) {
    if (!raw.trim()) continue;

    // Все числа в строке (целые и дробные): 1, 2, 200, 0.5, 1.00000000
    const matches = raw.match(/-?\d+(?:\.\d+)?/g);
    if (!matches || matches.length === 0) continue;

    // Остаток — последнее число в строке
    const num = parseFloat(matches[matches.length - 1]);
    if (isNaN(num)) continue;

    // Название — всё до последнего числа
    const lastNum = matches[matches.length - 1];
    const cutPos = raw.lastIndexOf(lastNum);
    let name = raw.substring(0, cutPos).trim();

    // Если название пустое — пробуем взять всю строку без последнего числа иначе
    if (!name) continue;

    // Отбрасываем служебные строки
    if (name.indexOf('Остатки товаров') !== -1) continue;
    if (name.indexOf('по всем складам') !== -1) continue;
    if (name.indexOf('Итого') !== -1) continue;
    if (name === 'Товар' || name.indexOf('Товар /') === 0) continue;
    if (name.indexOf('Дата обновления') !== -1) continue;

    result.push({ name: name, qty: num });
  }
  return result;
}

// Форматирование количества: 0.5 → 0,5 ; 2 → 2
function fmt(n) {
  const r = Math.round(n * 10) / 10;
  return Number.isInteger(r) ? r.toString() : r.toString().replace('.', ',');
}

function render(query) {
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  query = (query || '').toLowerCase().trim();

  // Показываем только товары с остатком > 0
  let filtered = goods.filter(g => Math.round(g.qty * 10) / 10 > 0);

  if (query) {
    filtered = filtered.filter(g => g.name.toLowerCase().indexOf(query) !== -1);
  }

  count.textContent = 'Найдено: ' + filtered.length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">❄️ Ничего не найдено</div>';
    return;
  }

  let html = '';
  for (let g of filtered) {
    html += '<div class="item">' +
              '<div class="name">' + escapeHtml(g.name) + '</div>' +
              '<div class="qty in">' + fmt(g.qty) + ' шт</div>' +
            '</div>';
  }
  list.innerHTML = html;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
}
</script>
</body>
</html>
